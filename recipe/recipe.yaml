schema_version: 1

context:
  name: tinycbor
  version: "7.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/intel/tinycbor/archive/v${{ version }}.tar.gz
  sha256: 08c0a4c0a983000806f3d8c1599ec07995789ae49e9a23034db4cbfccc81c2e5

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
  run_exports:
    - ${{ pin_subpackage(name|lower, upper_bound='x.x') }}

tests:
  - script:
      - if: unix
        then:
          - test -f ${PREFIX}/lib/libtinycbor${SHLIB_EXT}
          - test -f ${PREFIX}/lib/cmake/tinycbor/TinyCBOR-targets.cmake
          - test -f ${PREFIX}/include/tinycbor/cbor.h
          - test -f ${PREFIX}/include/tinycbor/tinycbor-version.h
          - test -f ${PREFIX}/include/tinycbor/tinycbor-export.h
          - test -f ${PREFIX}/bin/cbordump
      - if: win
        then:
          - if not exist %LIBRARY_BIN%\tinycbor.dll exit 1
          - if not exist %LIBRARY_LIB%\tinycbor.lib exit 1
          - if not exist %LIBRARY_LIB%\cmake\tinycbor\TinyCBOR-targets.cmake exit 1
          - if not exist %LIBRARY_INC%\tinycbor\cbor.h exit 1
          - if not exist %LIBRARY_INC%\tinycbor\tinycbor-version.h exit 1
          - if not exist %LIBRARY_INC%\tinycbor\tinycbor-export.h exit 1

about:
  homepage: https://github.com/intel/tinycbor
  summary: Concise Binary Object Representation (CBOR) Library
  description: |
    The TinyCBOR library is a small CBOR encoder and decoder library, optimized for very fast
    operation with very small footprint. The main encoder and decoder functions do not allocate memory.
  license: MIT
  license_file: LICENSE
  documentation: https://intel.github.io/tinycbor/current/
  repository: https://github.com/intel/tinycbor

extra:
  recipe-maintainers:
    - sdebionne
